name: Android APK

on:
  push:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Restore signing key (optional secret)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No signing secret configured; using the debug key."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "BambuControl-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BambuControl-apk
          path: apps/android/BambuControl-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Bambu Control – אנדרואיד (גרסה ${{ github.run_number }})"
          prerelease: true
          files: apps/android/BambuControl-${{ github.run_number }}.apk
          body: |
            להתקנה: פותחים את הקישור בטלפון, מורידים את קובץ ה-APK ומאשרים "התקנה ממקורות לא ידועים".
            מקור: ענף ${{ github.ref_name }}, commit ${{ github.sha }}
